name: CI

# Runs on every push and PR against main: lint, typecheck, unit tests, and
# a production build. All of these are safe/self-contained - no network,
# no live database - so they always run. The money-path integration
# tests (supabase/tests/) are deliberately NOT part of this job; they need
# real Supabase credentials for a disposable test account (see
# supabase/tests/README.md) and hit the live project, so they stay opt-in.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit -p tsconfig.json

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build
